<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Lombada</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lombada">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Direção: monocromático como Rastro e Trama. Preto, branco e cinza; sem cor de acento; JetBrains Mono. Diferenças entre livros e tipos de ligação vêm de tom de cinza e tracejado. */
:root{
  --bg:#151618; --surf:#1d1e21; --surf2:#26272a; --line:#2b2c30;
  --pastel:#e4dccb; --ins:#292b30; --insb:#454951; --hi:#9fb2c8; --hitx:#c9d3df; --bg0:#0b0b0c; --navon:#2a2b2f; --wk:#ececec; --wktx:#151618; --pink:#16140f; --tx:#ececec; --mut:#85878d; --acc:#ececec; --ink:#111;
  --serif:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:var(--H,100%);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
*{touch-action:manipulation}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:var(--H,100%);max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){html,body{background:var(--bg0)}#app{height:min(var(--H,100%),880px);margin-top:max(0px,calc((var(--H,100%) - 880px)/2));border:1px solid var(--line);border-radius:30px}}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(12px + env(safe-area-inset-top)) 18px 110px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.ser{font-family:var(--serif)}
h1,h2{font-family:var(--serif);font-weight:700;text-wrap:balance}h2{font-weight:500}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:38px;height:38px;border-radius:10px;background:var(--surf2);display:grid;place-items:center;color:var(--tx)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;min-height:40px}
.top h1{font-size:22px}
.btn{height:46px;padding:0 20px;border-radius:12px;background:var(--acc);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surf2);color:var(--tx)}.btn.wide{width:100%}.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.danger{background:transparent;color:var(--tx);border:1px solid var(--line)}
.chip{height:34px;padding:0 14px;border-radius:10px;background:var(--surf);border:1px solid var(--line);color:var(--mut);font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.chip.hi{background:var(--ins);color:var(--hitx);border:1.5px solid var(--hi)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:8px;color:var(--mut);font-size:13.5px}.seg button.on{background:var(--surf2);color:var(--tx)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;height:46px;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:0 10px;outline:none;font-size:15px;line-height:46px;text-align:left;color:var(--tx);color-scheme:dark}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.75);opacity:.7}
textarea{resize:none;min-height:110px;line-height:1.5}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;margin-bottom:6px}
/* nav */
nav{position:absolute;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px}
nav button{width:58px;height:48px;border-radius:10px;color:#6c6e74;display:grid;place-items:center}
nav button.on{color:var(--tx);background:var(--navon)}
nav .go{width:58px;height:58px;border-radius:16px;margin-top:-14px;background:var(--acc);color:var(--ink);border:4px solid var(--bg)}
/* covers */
.cover{position:relative;container-type:inline-size;aspect-ratio:2/3;border-radius:2px 4px 4px 2px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.45),inset 3px 0 0 rgba(255,255,255,.08);}
.cover .ci{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12cqw 9cqw 10cqw 15cqw}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover b{font-family:var(--serif);font-weight:600;font-size:10cqw;line-height:1.15;letter-spacing:-.02em;overflow-wrap:break-word;font-weight:700}
.cover i{font-style:normal;font-size:8cqw;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.cover u{position:absolute;left:0;right:0;height:9%;top:46%;text-decoration:none}
.shelfrow{display:flex;gap:14px;align-items:flex-end;padding:0 4px;flex-wrap:wrap;min-height:60px}
.board{height:8px;background:linear-gradient(#3b3c40,#26272a);border-radius:2px;box-shadow:0 5px 8px rgba(0,0,0,.45);margin:0 -4px 26px}
.spine{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:11px;padding:10px 0;border-radius:2px 2px 0 0;box-shadow:inset 2px 0 0 rgba(255,255,255,.1),inset -2px 0 0 rgba(0,0,0,.25);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bk{display:block;text-align:left}
.bk .cover{width:92px}
/* home */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:6px}
.week span.d{display:block;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.week .n{width:100%;max-width:42px;aspect-ratio:1;border-radius:10px;margin:0 auto;display:grid;place-items:center;font-size:13.5px;background:var(--surf);border:1px solid var(--line);color:var(--mut)}
.week .n.act{background:var(--wk);color:var(--wktx);border-color:var(--wk);font-weight:600}
.week .n.today{outline:2px solid var(--acc);outline-offset:2px}
.big{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.flame{color:var(--acc)}
.hs{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs .bk{flex:none;width:96px}
.pbar{height:5px;background:var(--surf2);border-radius:3px;overflow:hidden}.pbar>i{display:block;height:100%;background:var(--acc);border-radius:3px}
/* notes */
.cols{column-count:2;column-gap:10px}
.nc{break-inside:avoid;margin-bottom:10px;border-radius:12px;padding:13px 13px 11px;text-align:left;display:block;width:100%;border:1px solid var(--insb);position:relative;background:var(--ins)}
.pn{margin-bottom:24px}
.rd{background:var(--ins);border:1px solid var(--insb);border-radius:14px;padding:16px;margin-bottom:24px}
.rd .meta{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.rd .tt{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.25;margin:10px 0 12px;text-wrap:balance}
.rd .bd{font-size:15px;line-height:1.6;color:#d8d9dc;white-space:pre-wrap}
.rd .tg{margin-top:14px;font-size:12.5px;color:var(--mut)}
.rel.ins{background:var(--ins);border-color:var(--insb)}
.pt{font-weight:500}
.rtg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rtg button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:11px 12px;border-radius:12px;background:var(--surf);border:1px solid var(--line);color:var(--mut)}
.rtg button b{font-weight:700;font-size:13.5px;color:var(--tx)}
.rtg button small{font-size:11.5px;line-height:1.3}
.rtg button.on{background:var(--ins);border:1.5px solid var(--hi);color:var(--hitx)}
.gbox svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.gbox svg:active{cursor:grabbing}
.nc h3{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.2;margin:4px 0 6px;padding-right:18px}
.nc p{font-size:13px;color:var(--tx);opacity:.82;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.nc .ft{display:flex;justify-content:space-between;gap:6px;margin-top:9px;font-size:11.5px;color:var(--mut)}
.nc .st{position:absolute;right:10px;top:10px;color:var(--acc)}
.tag{font-size:12px;color:var(--mut);background:var(--surf2);border-radius:10px;padding:2px 8px;white-space:nowrap}
.rel{display:flex;gap:10px;align-items:center;padding:11px 12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* sheets */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surf);border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet.mid{border-radius:24px;margin:0 16px auto;margin-bottom:auto;margin-top:auto}
.ov.c{align-items:center}
.ov.c .sheet{border-radius:16px;margin:0 16px;border:1px solid var(--line)}
.dotst{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:8px;vertical-align:1px}.dotst.ok{background:#4cc38a}.dotst.er{background:#ff6b61}.dotst.go{background:#9fb2c8}
.dark>*{flex-shrink:0}
@media(max-height:700px){.dark .cvw{width:84px!important;margin:4px auto 10px!important}.dark h1{font-size:19px!important}.dark .cfgm{margin:16px 0 12px!important}.dark #cfgmin{font-size:32px!important;margin-bottom:8px!important}}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--tx);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:30;white-space:nowrap}
/* session */
.dark{background:var(--bg);position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));overflow-y:auto}
.clock{font-family:var(--serif);font-weight:700;font-size:64px;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.round{width:88px;height:88px;border-radius:22px;background:var(--acc);color:var(--ink);display:grid;place-items:center}
.stepper{display:flex;gap:8px;justify-content:center;align-items:center}
.stepper button{height:44px;min-width:44px;padding:0 12px;border-radius:10px;background:var(--surf2)}
.stepper input{width:90px;text-align:center;height:44px;border-radius:10px;font-size:18px}
.gin{display:flex;align-items:center;gap:4px}.gin input{width:54px;padding:0 4px}.gin span{color:var(--mut);font-size:14px;margin-right:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
.star{color:var(--line)}.star.on{color:var(--acc)}.star svg{fill:currentColor}
svg text{font-family:var(--sans)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;font-size:13px;color:var(--mut)}
.cal span.act{background:var(--tx);color:var(--bg);font-weight:600}
.cal span.today{outline:2px solid var(--acc);outline-offset:1px}
.cal span.h{aspect-ratio:auto;font-size:11px;color:var(--mut)}
.ph{font-size:11px;color:var(--mut);text-align:center;padding:8px 18px 0}

body{--surf:#292b30;--surf2:#353942;--line:#454951;--navon:#353a44}
body .card,body .ib,body .chip:not(.on):not(.hi),body .week .n:not(.act){border-color:var(--insb)}
body .cal span:not(.h):not(:empty){background:var(--surf);border:1px solid var(--line)}
body .cal span.act:not(.h){background:#ececec;border-color:#ececec;color:#151618;font-weight:700}
body .cal span.today{outline-color:#9fb2c8}
@keyframes nIn{from{opacity:0;transform:translateX(14px)}}main.nin{animation:nIn .18s ease-out}
</style>

<script>
'use strict';
/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5,MIN=6e4;
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const monday=t=>{const d=new Date(sod(t));d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DSEM=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const fmtMin=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+'h'+String(r).padStart(2,'0')+'min':h+'h'):m+'min'};
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const dfmt=t=>{const d=new Date(t);return d.getDate()+' de '+MESES[d.getMonth()].slice(0,3)+'.'};
const uid=()=>Math.random().toString(36).slice(2,9);

const IC={
 stats:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',shelf:'<path d="M5 4v14M9 4v14M13 6l4 12M3 21h18"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',star:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M8 5v14M16 5v14"/>',
 pen:'<path d="M4 20l4-1L19 8l-3-3L5 16z"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',graph:'<circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 8l3 8M16 8l-3 8M8.5 7h7"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',check:'<path d="M5 12l5 5 9-10"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19a2 2 0 0 1 2-2h13"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-9 9"/>'
};
const ic=(n,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ===== dados ===== */
/* livro: un = 'p' (páginas) ou 'l' (localização de e-book); pg = total, cur = posição atual na mesma unidade */
const B=(id,t,a,pg,st,cur,tags,syn,un)=>({id,t,a,pg,st,cur,tags,syn,un:un==='l'?'l':'p',rating:0,cover:null,cr:Date.now()});
let D={goal:210,books:[],notes:[],links:[],sessions:[]};
const U=b=>b&&b.un==='l'?{one:'localização',many:'localizações',cap:'Localização',sh:'loc.',tot:'Localização final',cur:'Localização atual',stop:'Localização em que parei',ph:'localizações por hora'}:{one:'página',many:'páginas',cap:'Página',sh:'p.',tot:'Total de páginas',cur:'Página atual',stop:'Página em que parei',ph:'páginas por hora'};
const nU=(b,n)=>n+' '+(n===1?U(b).one:U(b).many);
const bpct=b=>b&&b.pg>0?Math.round(Math.min(1,b.cur/b.pg)*100):0;

/* ===== estado ===== */
const S={tab:'home',view:'home',back:[],bid:null,nid:null,shelfMode:'capas',shelfTag:'',ins:{q:'',f:'todos'},stats:{p:'semana',m:0},modal:null,sess:null,end:null,toast:'',showAll:true,gSel:null,bt:'sobre'};
const GHOSTB={id:'?',t:'Livro removido',a:'',pg:1,cur:0,un:'p',st:'lido',tags:[],syn:'',rating:0,cover:null};
const book=id=>D.books.find(b=>b.id===id)||GHOSTB;
const note=id=>D.notes.find(n=>n.id===id);
const hsl=(h,s,l)=>`hsl(${h} ${s}% ${l}%)`;

/* ===== capas e lombadas procedurais (sem arte de terceiros) ===== */

const sessOf=(from,to)=>D.sessions.filter(s=>s.ts>=from&&s.ts<to);
function streak(){
 const days=new Set(D.sessions.map(s=>dk(s.ts)));let t=sod(Date.now()),n=0;
 if(!days.has(dk(t)))t-=DAY;
 while(days.has(dk(t))){n++;t-=DAY}return n;
}
function pace(bid){
 const ss=D.sessions.filter(s=>s.bid===bid);const m=ss.reduce((a,s)=>a+s.min,0),p=ss.reduce((a,s)=>a+s.pages,0);
 return m>=30?p/(m/60):0;
}
function forecast(b){
 const pph=pace(b.id);if(!pph||b.cur>=b.pg)return null;
 const recent=D.sessions.filter(s=>s.ts>Date.now()-14*DAY).reduce((a,s)=>a+s.min,0)/14; // min/dia, todos os livros
 const nLendo=Math.max(1,D.books.filter(x=>x.st==='lendo').length);
 const perDay=pph*(recent/60)/nLendo;if(perDay<=0)return null;
 return {pph,days:Math.ceil((b.pg-b.cur)/perDay)};
}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const toks=n=>new Set(norm(n.t+' '+n.x).split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)).map(w=>w.replace(/(s|es)$/,'')));
function simScore(a,b){
 const ta=toks(a),tb=toks(b);const w=[...ta].filter(x=>tb.has(x));
 const tg=a.tags.filter(x=>b.tags.includes(x));

function layout(ids,edges){
 const W=360,H=400,P=ids.map((id,i)=>{const a=i/ids.length*Math.PI*2;return {id,x:W/2+Math.cos(a)*(70+(i%3)*30),y:H/2+Math.sin(a)*(70+(i%3)*30),vx:0,vy:0}});
 const idx={};P.forEach((p,i)=>idx[p.id]=i);
 for(let it=0;it<260;it++){
  const k=1-it/300;

function GH(m,path,body,extra){return fetch((CFG.api||'https://api.github.com')+path,{method:m,headers:Object.assign({Authorization:'Bearer '+CFG.tok,Accept:'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{},extra||{}),body:body?jstr(body):undefined,cache:'no-store'})}
const errTxt=s=>s===401?'Token recusado ou expirado':s===403?'Sem permissão no repositório (ou limite de uso)':s===404?'Repositório não encontrado para este token':s===409||s===422?'Conflito de versão':typeof s==='number'?'Erro '+s+' do GitHub':'Sem conexão';
function setSyn(st,msg){SYN.state=st;SYN.msg=msg||'';if(S.modal==='goal')paintModal()}
async function pullF(F){const path='/repos/'+CFG.repo+'/contents/'+F.file;
 const r=await GH('GET',path,null,F.etag?{'If-None-Match':F.etag}:null);
 if(r.status===304)return null;if(r.status===404){F.sha=null;F.etag=null;return {}}if(!r.ok)throw r.status;
 const j=await r.json();F.sha=j.sha;let txt;
 if(j.content&&j.encoding==='base64'&&j.content.length)txt=b64d(j.content);else{const r2=await GH('GET',path,null,{Accept:'application/vnd.github.raw+json'});if(!r2.ok)throw r2.status;txt=await r2.text()}
 F.etag=r.headers.get('ETag');let d;try{d=JSON.parse(txt)}catch(e){throw 'Arquivo remoto ilegível'}return (d&&d.rec)||{}}
function mergeF(store,F,rem){let ch=false;F.rts={};for(const k in rem){const b=rem[k];F.rts[k]=b.ts||0;const a=store[k];if(!a||(b.ts||0)>(a.ts||0)){store[k]={v:b.v,ts:b.ts||0};ch=true}}return ch}
function needPush(store,F){for(const k in store)if((store[k].ts||0)>(F.rts[k]||0))return true;return false}
async function syncFile(key){const F=SYN.f[key],store=ST[key];let changed=false;
 for(let i=0;i<3;i++){const rem=await pullF(F);if(rem&&mergeF(store,F,rem))changed=true;
  if(!needPush(store,F))break;
  const body={message:'lombada '+VER,content:b64e(jstr({v:1,rec:store}))};if(F.sha)body.sha=F.sha;
  const p=await GH('PUT','/repos/'+CFG.repo+'/contents/'+F.file,body);
  if(p.ok){const j=await p.json();F.sha=j.content&&j.content.sha;F.etag=null;for(const k in store)F.rts[k]=store[k].ts||0;break}
  if((p.status===409||p.status===422)&&i<2){F.etag=null;continue}throw p.status}
 return changed}
async function syncNow(){if(!CFG||!navigator.onLine){if(CFG)setSyn('er','Sem conexão');return}if(SYN.busy){SYN.again=true;return}SYN.busy=true;setSyn('go','Sincronizando…');
 try{if(svT)await flush();const a=await syncFile('m'),b=await syncFile('c');
  if(a||b){rebuild();await persist();uiRefresh()}
  SYN.last=Date.now();setSyn('ok','Sincronizado às '+new Date().toTimeString().slice(0,5))}
 catch(e){setSyn('er',typeof e==='string'?e:errTxt(e))}
 finally{SYN.busy=false;if(SYN.again){SYN.again=false;schedSync()}}}

function readRastroCfg(){return new Promise(ok=>{let done=false;const fin=v=>{if(!done){done=true;ok(v)}};
 try{const r=indexedDB.open('rastro');r.onupgradeneeded=e=>{try{e.target.transaction.abort()}catch(_){}fin(null)};r.onerror=()=>fin(null);
  r.onsuccess=()=>{const db=r.result;try{if(!db.objectStoreNames.contains('kv')){db.close();return fin(null)}const q=db.transaction('kv').objectStore('kv').get('cfg');q.onsuccess=()=>{db.close();const c=q.result;fin(c&&c.repo&&c.tok?{repo:c.repo,tok:c.tok}:null)};q.onerror=()=>{db.close();fin(null)}}catch(_){try{db.close()}catch(e){}fin(null)}}}catch(_){fin(null)}})}
async function connect(repo,tok){repo=String(repo||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');tok=String(tok||'').trim();
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw 'Repositório no formato dono/nome';if(tok.length<20)throw 'Informe o token';
 const old=CFG;CFG={repo,tok,api:window.LOMBADA_API};
 try{const r=await GH('GET','/repos/'+repo);if(!r.ok)throw errTxt(r.status);const j=await r.json();if(!j.private)throw 'O repositório precisa ser privado';
  await IDB.set('cfg',CFG);Object.values(SYN.f).forEach(F=>{F.etag=null;F.sha=null;F.rts={}});await syncNow()}
 catch(e){CFG=old;throw typeof e==='string'?e:errTxt(e)}}

 else if(i==='nt')note(S.nid).t=v;else if(i==='nx')note(S.nid).x=v;else if(i==='npg')note(S.nid).pg=+v||0;
 else if(i==='ntags')note(S.nid).tags=v.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
 else if(i==='cfgrange'){S.cfg.min=+v;$('#cfgmin').textContent=v+' min'}
 else if(i==='pcur'){const b=book(S.bid);b.cur=Math.max(0,Math.min(b.pg,+v||0))}
 else if(i==='ptot'){const b=book(S.bid);b.pg=Math.max(1,+v||1);b.cur=Math.min(b.cur,b.pg)}
 else if(i==='ename')S.end.name=v;else if(i==='enote')S.end.note=v;else if(i==='emin'){S.end.ms=Math.max(0,Math.min(600,Math.round(+v||0)))*MIN}else if(i==='edate')S.end.date=v;else if(i==='epages')S.end.pages=Math.max(0,Math.round(+v||0));else if(i==='etime')S.end.time=v;
 else if(i==='gh'||i==='gm')D.goal=gRead();
 else if(i==='eval'){const b=book(S.end.bid);S.end.to=Math.max(0,Math.min(b.pg,S.end.unit==='pg'?+v||0:Math.round((+v||0)/100*b.pg)));const n=Math.max(0,S.end.to-b.cur);$('#epl').textContent=eplText(b,S.end)}
});
document.addEventListener('change',ev=>{
 const t=ev.target,i=t.dataset.i;if(!i)return;save();
 if(i==='status'){const b=book(S.bid);b.st=t.value;if(b.st==='lido'){b.cur=b.pg;b.fim=b.fim||Date.now()}if(b.st!=='quero'&&!b.ini)b.ini=Date.now();render()}
 else if(i==='ntype'){note(S.nid).type=t.value;render()}
 else if(i==='nt'||i==='nx'||i==='ntags'){}
 else if(i==='gh'||i==='gm'){D.goal=gRead();gPaint()}
 else if(i==='showAll'){S.showAll=t.checked;render()}
 else if(i==='cover'&&t.files[0])compress(t.files[0],(d,kb)=>{S.addf.cover=d;S.addf.kb=kb;render()});
});
const setH=()=>document.documentElement.style.setProperty('--H',window.innerHeight+'px');setH();addEventListener('resize',setH);addEventListener('orientationchange',()=>setTimeout(setH,300));
$('#impf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importAll(f)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(svT)flush();if(CFG){clearTimeout(SYN.timer);syncNow()}}else if(CFG)syncNow()});
addEventListener('pagehide',()=>{if(svT)flush()});addEventListener('online',()=>{if(CFG)syncNow()});
setInterval(()=>{if(CFG&&!document.hidden)syncNow()},60000);
(async()=>{
 try{const st=await IDB.get('st');if(st&&st.m)ST={m:st.m||{},c:st.c||{}};CFG=(await IDB.get('cfg'))||null;const ss=await IDB.get('sess');if(ss&&ss.bid)S.sess=ss}catch(e){}
 rebuild();if(S.sess&&D.books.some(b=>b.id===S.sess.bid))S.view='sessRun';else S.sess=null;
 render();
 if('serviceWorker' in navigator&&location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller;let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl&&!S.sess){rl=1;location.reload()}});navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if(CFG)syncNow();
})();
</script>
